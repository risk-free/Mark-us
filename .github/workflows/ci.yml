name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes -qq shellcheck
          shellcheck infra/scripts/*.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  supply-chain:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=high

  images:
    name: image · ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.image }}
          push: false
          tags: markus-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  integration:
    name: compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api image for the production-gate test
        run: docker build -f infra/Dockerfile.api -t markus-api:ci .

      - name: Boot the full stack
        run: docker compose --profile app up -d --build

      - name: API health
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-connrefused --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:3001/health | tee /dev/stderr | grep -q '"ok":true'

      - name: Web responds
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 20 --retry-connrefused --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:3000/

      - name: Worker stays up
        run: |
          docker compose ps --status running --format '{{.Service}}' | grep -qx worker

      - name: Refuses to boot in production with development configuration (D-01)
        run: |
          if docker run --rm \
            -e NODE_ENV=production \
            -e SESSION_SECRET=ci-only-secret-ci-only-secret-ci-only-01 \
            markus-api:ci; then
            echo "expected the api image to refuse to start" >&2
            exit 1
          fi

      - name: Dump logs
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile app down -v
