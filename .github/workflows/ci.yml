name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · contract · node-baseline · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Contract lint (ARCH-03, M1.1)
        run: pnpm contract:lint

      - name: Single Node major (M1.6)
        run: pnpm check:node

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes -qq shellcheck
          shellcheck infra/scripts/*.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  migrations:
    name: schema · migration drift (M3.1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markus
          POSTGRES_PASSWORD: markus
          POSTGRES_DB: markus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markus -d markus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://markus:markus@localhost:5432/markus
      SHADOW_DATABASE_URL: postgresql://markus:markus@localhost:5432/markus_shadow
      # psql always connects through the maintenance database; it must exist
      # before the scratch databases below can be created or dropped.
      PG_MAINTENANCE_URL: postgresql://markus:markus@localhost:5432/markus
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: prisma validate
        run: pnpm db:validate

      # Check 1 only: no database is involved, so it runs first and cheaply.
      - name: migration.sql matches schema.prisma + fragments
        run: pnpm db:drift
        env:
          DATABASE_URL: ""
          SHADOW_DATABASE_URL: ""

      - name: Create empty scratch databases
        run: |
          psql "$PG_MAINTENANCE_URL" -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS markus_migrate;' \
            -c 'CREATE DATABASE markus_migrate;' \
            -c 'DROP DATABASE IF EXISTS markus_shadow;' \
            -c 'CREATE DATABASE markus_shadow;'

      # The migration target is a scratch database. Never `markus`.
      - name: Apply migrations to a scratch database
        run: pnpm db:deploy
        env:
          DATABASE_URL: postgresql://markus:markus@localhost:5432/markus_migrate

      # Check 2: prisma migrate diff --from-migrations applies the migrations into
      # the shadow database, so it must be the empty one created just above.
      - name: Migrated database matches the Prisma schema (zero drift)
        run: pnpm db:drift

  supply-chain:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit against the registry exception registry
        run: pnpm check:supply-chain
        env:
          AUDIT_REGISTRY: https://registry.npmjs.org

  images:
    name: image · ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.image }}
          push: false
          tags: markus-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  integration:
    name: compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api image for the production-gate test
        run: docker build -f infra/Dockerfile.api -t markus-api:ci .

      - name: Boot the full stack
        run: docker compose --profile app up -d --build

      - name: API health
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-connrefused --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:3001/health | tee /dev/stderr | grep -q '"ok":true'

      - name: Web responds
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 20 --retry-connrefused --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:3000/

      # Until P2 registers a processor, the worker's designed behaviour is to open
      # the queues, report that it has nothing to consume, and exit 0. Assert that
      # behaviour. The liveness assertion ("worker stays up") returns at the P2 gate,
      # where workers actually hold a BullMQ connection open — see the note below.
      - name: Worker reports the P0 scaffold state and exits cleanly
        run: |
          if ! docker compose logs --no-color worker 2>/dev/null | grep -q "no processors are registered"; then
            echo "expected the worker to report the P0 scaffold state" >&2
            docker compose logs --no-color worker
            exit 1
          fi

      # P2 gate (mandate M5.3): replace the step above with a real liveness check,
      # e.g. `docker compose ps --status running --format '{{.Service}}' | grep -qx worker`
      # plus a DLQ assertion. Do not add it before processors exist.

      - name: Refuses to boot in production with development configuration (D-01)
        run: |
          if docker run --rm \
            -e NODE_ENV=production \
            -e SESSION_SECRET=ci-only-secret-ci-only-secret-ci-only-01 \
            markus-api:ci; then
            echo "expected the api image to refuse to start" >&2
            exit 1
          fi

      - name: Dump logs
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile app down -v
