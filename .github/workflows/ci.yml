name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · contract · node-baseline · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # generate first so @markus/api#typecheck can never race @markus/db#typecheck
      # (api's script is bare `tsc`; it does not generate the client itself).
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Contract lint (ARCH-03, M1.1)
        run: pnpm contract:lint

      # SCHEDULE 1.3 + M8.3/M8.4: the marketing copy is gated in CI, not by hand.
      #   content-lint      — no prohibited claim (no success rate, no "best"/"leading")
      #   score-disclosure  — every score-bearing surface carries its disclaimer
      #   i18n-parity       — en / zh-CN / zh-TW hold exactly the same key set
      #   third-party       — no analytics SDK, pixel or tracker (M8.3)
      # TypeScript is not enough for any of these: a missing translation key and a
      # forbidden marketing claim both compile cleanly.
      - name: Marketing compliance gates (M8.3, M8.4, SCHEDULE 1.3)
        run: pnpm --filter @markus/web check:compliance

      - name: Single Node major (M1.6)
        run: pnpm check:node

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes -qq shellcheck
          shellcheck infra/scripts/*.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Eval harness · prompt regression + zero-PII (M5b)
        run: pnpm --filter @markus/eval test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  migrations:
    name: schema · migration drift (M3.1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markus
          POSTGRES_PASSWORD: markus
          POSTGRES_DB: markus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markus -d markus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The drift gate's `prisma migrate diff` resolves the datasource side from
      # DATABASE_URL, and the fragment check reads it too. Both must see the
      # scratch database that the deploy step migrates, so the job default is
      # markus_migrate, not the empty maintenance DB `markus`.
      DATABASE_URL: postgresql://markus:markus@localhost:5432/markus_migrate
      SHADOW_DATABASE_URL: postgresql://markus:markus@localhost:5432/markus_shadow
      # psql always connects through the maintenance database; it must exist
      # before the scratch databases below can be created or dropped.
      PG_MAINTENANCE_URL: postgresql://markus:markus@localhost:5432/markus
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (check 3 queries through @prisma/client)
        run: pnpm db:generate

      - name: prisma validate
        run: pnpm db:validate

      # Check 1 only: no database is involved, so it runs first and cheaply.
      - name: migration.sql matches schema.prisma + fragments
        run: pnpm db:drift
        env:
          DATABASE_URL: ""
          SHADOW_DATABASE_URL: ""

      - name: Create empty scratch databases
        run: |
          psql "$PG_MAINTENANCE_URL" -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS markus_migrate;' \
            -c 'CREATE DATABASE markus_migrate;' \
            -c 'DROP DATABASE IF EXISTS markus_shadow;' \
            -c 'CREATE DATABASE markus_shadow;'

      # The migration target is a scratch database. Never `markus`.
      - name: Apply migrations to a scratch database
        run: pnpm db:deploy
        env:
          DATABASE_URL: postgresql://markus:markus@localhost:5432/markus_migrate

      # Check 2: prisma migrate diff runs datamodel -> datasource. The datasource
      # side resolves DATABASE_URL (the job default, markus_migrate). The shadow
      # database must be the empty one created just above for --shadow-database-url.
      - name: Migrated database matches the Prisma schema (zero drift)
        run: pnpm db:drift

  outbox-integration:
    name: outbox fault-injection · PostgreSQL 16 (M3.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (the integration test drives @prisma/client)
        run: pnpm db:generate

      # ARCH-01 §13: outbox behaviour is verified against a real PostgreSQL 16
      # container — no mock database. testcontainers talks to the runner's Docker
      # socket, so no service block is needed.
      - name: Outbox relay fault-injection against a real Postgres
        run: pnpm --filter @markus/outbox test:integration

  tm-ingest-integration:
    name: tm ingest · PostgreSQL 16 (M7.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (the integration test drives @prisma/client)
        run: pnpm db:generate

      # ARCH-01 §13: corpus ingest behaviour is verified against a real
      # PostgreSQL 16 container — no mock database. testcontainers talks to the
      # runner's Docker socket, so no service block is needed.
      - name: Corpus ingest against a real Postgres
        run: pnpm --filter @markus/tm-data test:integration

  api-search-integration:
    name: api search · PostgreSQL 16 (M7.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (the integration test drives @prisma/client)
        run: pnpm db:generate

      # ARCH-01 §13: /tm/search ranking + freshness gates are verified against a
      # real PostgreSQL 16 container — no mock database.
      - name: Corpus search + freshness gates against a real Postgres
        run: pnpm --filter @markus/api test:integration

  supply-chain:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit against the registry exception registry
        run: pnpm check:supply-chain
        env:
          AUDIT_REGISTRY: https://registry.npmjs.org

  images:
    name: image · ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.image }}
          push: false
          tags: markus-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  integration:
    name: compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api image for the production-gate test
        run: docker build -f infra/Dockerfile.api -t markus-api:ci .

      - name: Boot the full stack
        run: docker compose --profile app up -d --build

      # ARCH-01 §12 ruling 3 (BUG-041): every content assertion must carry an
      # expected marker + byte-size floor so a 200 from an empty shell can
      # never pass. Floors sized against the real placeholder (web ≈ 6 KB,
      # api /health ≈ 88 B) on a Linux ubuntu-latest authority, per ruling 2.
      - name: API health (ok marker + byte-size floor)
        run: |
          body=$(curl --fail --silent --show-error \
            --retry 20 --retry-connrefused --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:3001/health)
          printf '%s\n' "$body" | tee /dev/stderr | grep -q '"ok":true' \
            || { echo "missing \"ok\":true marker (empty shell?)" >&2; exit 1; }
          [ "${#body}" -ge 40 ] \
            || { echo "health payload too small: ${#body} B < 40" >&2; exit 1; }

      # SCHEDULE 1.2: `localePrefix: "always"` means `/` is a redirect to a
      # concrete locale (prefix > cookie > IP > Accept-Language > zh-CN), so the
      # probe must follow it -- `--fail` alone would read the empty 307 body and
      # fail on a perfectly healthy site. The assertions below are unchanged: an
      # empty shell still cannot pass the marker + byte-floor checks.
      #
      # D-31 follow-up: floors are now sized against the localized landing page
      # (~52 KB / ~43k chars per prerender output), not the retired ~6 KB
      # placeholder. The smallest locale body measured was zh-CN at 42916 chars
      # / 52137 B, so a 34000 B floor (~20% below the minimum) holds whether
      # bash counts characters or bytes, while a truncated header-only body
      # (~1 KB) still fails.
      - name: Web responds (markers + localized-page floor)
        run: |
          body=$(curl --fail --silent --show-error --location \
            --retry 20 --retry-connrefused --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:3000/)
          echo "web body ${#body} B"
          printf '%s' "$body" | grep -q '<!DOCTYPE html>' \
            || { echo "missing DOCTYPE marker (empty shell?)" >&2; exit 1; }
          printf '%s' "$body" | grep -q 'MarkUS' \
            || { echo "missing page marker (empty shell?)" >&2; exit 1; }
          [ "${#body}" -ge 34000 ] \
            || { echo "page too small: ${#body} B < 34000" >&2; exit 1; }

      # M3.4: the worker now holds the queues open and runs the transactional-outbox
      # relay, so it must stay running (it no longer exits with "no processors").
      # Assert liveness and that the relay started ticking.
      - name: Worker is running and the outbox relay started (M3.4)
        run: |
          for attempt in $(seq 1 20); do
            if docker compose ps --status running --format '{{.Service}}' | grep -qx worker \
              && docker compose logs --no-color worker 2>/dev/null | grep -qF "[outbox-relay] ticking every"; then
              exit 0
            fi
            sleep 3
          done
          echo "worker did not come up / start the outbox relay" >&2
          docker compose logs --no-color worker
          exit 1

      - name: Refuses to boot in production with development configuration (D-01)
        # R-023: SESSION_SECRET is the dev fallback — valid base64 that passes
        # the schema and must be refused by the production placeholder gate.
        run: |
          if docker run --rm \
            -e NODE_ENV=production \
            -e SESSION_SECRET=bWFya3VzLWRldi1zZXNzaW9uLXNlY3JldC0tZG8tbm90LXVzZS1pbi1wcm9k \
            -e MAGIC_LINK_SECRET=hUAq9iFig1WvKefdic76wotLJEYh5ndNEWTLKOB5NRwpA8o5HX3oy5ZFBbT753Fn \
            markus-api:ci; then
            echo "expected the api image to refuse to start" >&2
            exit 1
          fi

      - name: Dump logs
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile app down -v
