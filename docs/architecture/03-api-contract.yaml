  /documents:
    post:
      operationId: createDocumentUpload
      tags: [documents]
      summary: Request an upload slot; the client then PUTs bytes straight to object storage
      description: |
        Two-step flow: this call returns a single-use presigned URL and a `Document` row in
        `PENDING_UPLOAD`; the client uploads to R2 without the API seeing the bytes; then
