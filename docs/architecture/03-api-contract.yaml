      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentCreateRequest" }
      responses:
        "201":
          description: Upload slot reserved
          headers:
            Idempotent-Replay: { $ref: "#/components/headers/IdempotentReplay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentUploadTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: Declared file size exceeds the 25 MB limit
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

