            application/json:
              schema: { $ref: "#/components/schemas/AuditEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/jobs:
    get:
      operationId: listJobs
      tags: [audit]
      summary: List async jobs and their state (MASTER_ADMIN)
      x-contract-status: provisional
      x-phase: P7
      x-permission: admin.jobs.read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: queue
          in: query
          schema: { $ref: "#/components/schemas/QueueName" }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/JobState" }
      responses:
        "200":
          description: Job page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
                  nextCursor: { type: ["string", "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/jobs/{jobId}/replay:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: replayJob
      tags: [audit]
      summary: Replay a failed or dead-lettered job
      description: |
        Idempotent: replays rely on `idempotencyKey` and outbox de-duplication, so replaying a
        partially completed job must not double-charge, double-send or duplicate audit rows.
      x-contract-status: final
      x-phase: P7
      x-permission: admin.jobs.replay
      x-audit: JOB_REPLAYED
      x-idempotent: true
      responses:
        "202":
          description: Replay queued
          headers:
            Idempotent-Replay: { $ref: "#/components/headers/IdempotentReplay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Job is not in a replayable state
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /analytics/events:
    post:
      operationId: ingestAnalyticsEvent
      tags: [erp]
      summary: First-party analytics beacon
      description: |
        Self-hosted, no third-party analytics (D-07). Accepts a batch of at most 50 events; rejects
        unknown event names so the taxonomy cannot drift silently.
      security: []
      x-contract-status: PENDING-P7
      x-phase: P7
      x-ratelimit: "600 / 1min per session"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsBatch" }
      responses:
        "202": { description: Accepted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413":
          description: Batch too large
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      tags: [commerce]
      summary: Stripe event receiver
      description: |
        Verified with the Stripe signature over the raw body. Handlers are idempotent on
        `providerEventId`; the outbox drains the follow-up work.
      security: []
      x-contract-status: final
      x-phase: P4
      responses:
        "200": { description: Event accepted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Missing or invalid signature
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /webhooks/paypal:
    post:
      operationId: receivePayPalWebhook
      tags: [commerce]
      summary: PayPal event receiver
      security: []
      x-contract-status: final
      x-phase: P4
      responses:
        "200": { description: Event accepted }
        "401":
          description: Verification failed
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /webhooks/wechat-pay:
    post:
      operationId: receiveWeChatPayWebhook
      tags: [commerce]
      summary: WeChat Pay notification receiver
      description: |
        WeChat Pay is exposed only where mainland merchant accounts exist; otherwise the
        `ENABLE_WECHAT_PAY` flag keeps the route dormant (OPEN-01).
      security: []
      x-contract-status: PENDING-P4
      x-phase: P4
      responses:
        "200": { description: Event accepted }
        "401":
          description: Signature verification failed
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: Route disabled by configuration
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /webhooks/alipay:
    post:
      operationId: receiveAlipayWebhook
      tags: [commerce]
      summary: Alipay asynchronous notification receiver
      security: []
      x-contract-status: PENDING-P4
      x-phase: P4
      responses:
        "200": { description: Event accepted }
        "401":
          description: Signature verification failed
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: Route disabled by configuration
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /integrations/wecom/callback:
    get:
      operationId: verifyWeComCallback
      tags: [integrations]
      summary: WeCom callback URL verification handshake
      security: []
      x-contract-status: final
      x-phase: P3
      parameters:
        - name: msg_signature
          in: query
          required: true
          schema: { type: string }
        - name: echostr
          in: query
          required: true
          schema: { type: string }
        - name: timestamp
          in: query
          required: true
          schema: { type: string }
        - name: nonce
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Echo the decrypted challenge
          content:
            text/plain:
              schema: { type: string }
        "401":
          description: Signature verification failed
          content:
            text/plain:
              schema: { type: string }

  /webhooks/wecom:
    post:
      operationId: receiveWeComEvent
      tags: [integrations]
      summary: WeCom message event receiver
      description: |
        Primary CRM intake (D-06). Inbound messages become `Message` rows and, for new
        correspondents, `Lead` rows via the outbox pipeline. Deduplicated on
        `(wechatOpenId, msgId)`.
      security: []
      x-contract-status: final
      x-phase: P3
      requestBody:
        required: true
        content:
          application/xml:
            schema: { type: string, description: WeCom XML envelope }
      responses:
        "200": { description: Accepted (empty body, as WeCom expects) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Signature verification failed
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: mkus_staff
      description: Opaque session handle; the real secret stays server-side in Redis.
    portalSession:
      type: apiKey
      in: cookie
      name: mkus_portal
      description: Client session obtained by redeeming a magic link.
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Required on every staff or client mutation; bound to the session record.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous `nextCursor`; omit for the first page.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Locale:
      name: locale
      in: query
      description: Preferred locale for returned copy.
      schema: { type: string, enum: [zh-CN, en-US, zh-HK], default: zh-CN }
    IfMatch:
      name: If-Match
      in: header
      description: Required for updates to versioned aggregates; use the `version` value or ETag.
      schema: { type: string, pattern: '^"?[0-9]+"?$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated key; replays within 24 h return the original response.
      schema: { type: string, minLength: 8, maxLength: 128 }
    StaffId:
      name: staffId
      in: path
      required: true
      schema: { type: string }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string }
    LeadId:
      name: leadId
      in: path
      required: true
      schema: { type: string }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string }
    TrademarkId:
      name: trademarkId
      in: path
      required: true
      schema: { type: string }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string }
    OfficeActionId:
      name: officeActionId
      in: path
      required: true
      schema: { type: string }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }

  headers:
    IdempotentReplay:
      description: Present and `true` when the response was replayed from a stored idempotency record.
      schema: { type: string, enum: ["true"] }
    TraceId:
      description: Correlation id, also present in logs and error bodies.
      schema: { type: string }
    RateLimitRemaining:
      description: Requests left in the current window.
      schema: { type: integer }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, expired or invalid session
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated but not permitted, or the row is out of scope
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource absent or not visible to this actor
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State or concurrency conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail with a stable machine-readable `code`.
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri, default: "https://api.markus.hk/problems/" }
        title: { type: string, example: "Payment required before filing" }
        status: { type: integer, example: 409 }
        detail: { type: string, description: Human-readable explanation; never contains PII or secrets. }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          description: Stable error code.
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - CSRF_FAILED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - VERSION_MISMATCH
            - PRECONDITION_UNMET
            - RATE_LIMITED
            - UNKNOWN_FIELD
            - STEP_UP_REQUIRED
            - ACCOUNT_LOCKED
            - PROVIDER_ERROR
            - UPSTREAM_UNAVAILABLE
            - CONSENT_REQUIRED
            - CORPUS_STALE
        traceId: { type: string }
        errors:
          type: array
          description: Field-level details, present when `code=VALIDATION_FAILED`.
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string, example: "items[0].niceClass" }
              message: { type: string }
              rule: { type: string, example: "pattern" }
        extensions:
          type: object
          description: Additive, feature-specific context; must stay backward compatible.
          additionalProperties: true
      additionalProperties: false

    Money:
      type: object
      description: Monetary amount as a decimal string. JSON numbers are forbidden (D-05).
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: "^-?[0-9]{1,12}(\\.[0-9]{1,2})?$", example: "1499.00" }
        currency: { type: string, enum: [USD, CNY, HKD], example: USD }
      additionalProperties: false

    DisplayMoney:
      type: object
      description: Client presentation view. Informational; the charge is always in `Money`.
      required: [amount, currency, rateSource]
      properties:
        amount: { type: string, example: "10600.00" }
        currency: { type: string, enum: [USD, CNY, HKD] }
        rateAsOf: { type: string, format: date-time }
        rateSource: { type: string, enum: [MANUAL, PROVIDER] }
      additionalProperties: false

    HealthResponse:
      type: object
      description: |
        Shape frozen by the shipped P0 handler and asserted by the CI smoke gate, which greps for
        `"ok":true`. The four original fields are therefore required and immutable; build metadata
        may only be added additively.
      required: [ok, service, env, time]
      properties:
        ok: { type: boolean, const: true }
        service: { type: string, example: markus-api }
        env: { type: string, enum: [development, test, staging, production] }
        time: { type: string, format: date-time }
        version: { type: string, nullable: true, description: Build version, added in P1. }
        commitSha: { type: string, nullable: true, description: Build commit, added in P1. }
        uptimeSeconds: { type: integer, minimum: 0, nullable: true, description: Added in P1. }
      additionalProperties: false

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, degraded] }
        checks:
          type: object
          additionalProperties: { $ref: "#/components/schemas/DependencyCheck" }
      additionalProperties: false

    DependencyCheck:
      type: object
      required: [status, latencyMs]
      properties:
        status: { type: string, enum: [up, down, degraded] }
        latencyMs: { type: integer, minimum: 0 }
        error: { type: string, nullable: true }
      additionalProperties: false

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      additionalProperties: false

    LoginResponse:
      type: object
      required: [actor, expiresAt]
      properties:
        actor: { $ref: "#/components/schemas/ActorContext" }
        csrfToken: { type: string, description: Value for the `x-csrf-token` header. }
        expiresAt: { type: string, format: date-time }
      additionalProperties: false

    MfaChallengeResponse:
      type: object
      required: [challengeId, expiresAt]
      properties:
        challengeId: { type: string }
        expiresAt: { type: string, format: date-time, description: 5-minute lifetime. }
        methods: { type: array, items: { type: string, enum: [TOTP, WEBAUTHN] } }
      additionalProperties: false

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code: { type: string, minLength: 6, maxLength: 10, writeOnly: true }
      additionalProperties: false

    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        contactId: { type: string, description: Optional hint to select among duplicate emails. }
      additionalProperties: false

    MagicLinkAccepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACCEPTED] }
        message: { type: string, example: "If the address is known, a sign-in link is on its way." }
      additionalProperties: false

    MagicLinkVerifyRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 512, writeOnly: true }
      additionalProperties: false

    PortalSessionResponse:
      type: object
      required: [contactId, expiresAt]
      properties:
        contactId: { type: string }
        displayName: { type: string }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
      additionalProperties: false

    Role:
      type: string
      enum: [MASTER_ADMIN, EXPERT, SALESPERSON]
      description: |
        `MASTER_ADMIN` full control; `EXPERT` read-everything plus case, document and filing writes;
        `SALESPERSON` own-record access only.
        For client (CONTACT) sessions role is `null` and the actor carries exactly `["self"]`;
        the invariant role:null ⟺ contactId non-null is documented, not schema-expressible.

    StaffStatus:
      type: string
      enum: [INVITED, ACTIVE, DISABLED]

    ActorContext:
      type: object
      required: [actorId, role, locale]
      properties:
        actorId: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        locale: { type: string, enum: [zh-CN, en-US, zh-HK] }
        contactId: { type: string, nullable: true, description: Set for client sessions only. role:null ⟺ contactId non-null. }
        permissions:
          type: array
          description: |
            Effective permission strings, resolved server-side; the client never decides.
            Client (CONTACT) actors carry exactly ["self"] and are deny-by-default on staff surfaces.
          items: { type: string }
      additionalProperties: false

    StaffUser:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/StaffStatus" }
        locale: { type: string, enum: [zh-CN, en-US, zh-HK] }
        mfaEnabled: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        deactivatedAt: { type: string, format: date-time, nullable: true }
      additionalProperties: false

    StaffCreateRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, maxLength: 120 }
        role: { $ref: "#/components/schemas/Role" }
        locale: { type: string, enum: [zh-CN, en-US, zh-HK], default: zh-CN }
      additionalProperties: false

    StaffPatchRequest:
      type: object
      properties:
        displayName: { type: string, maxLength: 120 }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/StaffStatus" }
        locale: { type: string, enum: [zh-CN, en-US, zh-HK] }
      additionalProperties: false

    DisableStaffRequest:
      type: object
      properties:
        reason: { type: string, minLength: 8, maxLength: 500 }
        reassignOpenCasesTo: { type: string, description: Staff id that inherits open assignments. }
      additionalProperties: false

    VaultWriteRequest:
      type: object
      required: [usptoUsername, usptoPassword]
      properties:
        usptoUsername: { type: string, minLength: 3, maxLength: 128, writeOnly: true }
        usptoPassword: { type: string, minLength: 8, maxLength: 256, writeOnly: true }
        mfaSeed:
          type: "null"
          description: |
            Forbidden by design. Present only so that a client sending it receives an explicit
            `400 UNKNOWN_FIELD` instead of silent acceptance (D-01).
        rotationReason: { type: string, maxLength: 200 }
      additionalProperties: false

    VaultStatus:
      type: object
      required: [hasSecret, updatedAt]
      properties:
        hasSecret: { type: boolean }
        updatedAt: { type: string, format: date-time, nullable: true }
        rotationDueAt: { type: string, format: date-time, nullable: true }
        lastRevealedAt: { type: string, format: date-time, nullable: true, description: Metadata only. }
      additionalProperties: false

    VaultRevealResponse:
      type: object
      required: [usptoUsername, usptoPassword]
      properties:
        usptoUsername: { type: string }
        usptoPassword: { type: string, writeOnly: true }
        expiresInSeconds: { type: integer, const: 60 }
      additionalProperties: false

    ContactStatus:
      type: string
      enum: [LEAD, ACTIVE, INACTIVE, ARCHIVED]

    LeadStage:
      type: string
      enum:
        - INTAKE
        - CONTACTED
        - ASSESSED
        - PROPOSAL
        - PAYMENT_PENDING
        - FILED
        - CLOSED
      description: Pipeline order is normative for the D-07 funnel metrics.

    LeadSource:
      type: string
      enum: [WECOM, REFERRAL, MARKETING, WALK_IN, PARTNER]

    LeadStatus:
      type: string
      enum: [NEW, ASSIGNED, CONTACTED, QUALIFIED, CONVERTED, CLOSED]

    Channel:
      type: string
      enum: [WECOM, EMAIL, PHONE, INTERNAL, SYSTEM]

    ConversationStatus:
      type: string
      enum: [OPEN, PENDING_CLIENT, PENDING_US, RESOLVED, ARCHIVED]

    Contact:
      type: object
      required: [id, displayName, locale, stage, status, createdAt]
      properties:
        id: { type: string }
        wechatAlias: { type: string, nullable: true }
        wechatOpenId: { type: string, nullable: true, description: Present only for linked WeCom correspondents. }
        displayName: { type: string }
        email: { type: string, format: email, nullable: true }
        phoneE164: { type: string, nullable: true }
        companyName: { type: string, nullable: true }
        region: { type: string, enum: [HK, US, CN, OTHER], default: HK }
        locale: { type: string, enum: [zh-CN, en-US, zh-HK] }
        preferredContactMethod: { $ref: "#/components/schemas/Channel" }
        tags:
          type: array
          items: { type: string, maxLength: 40 }
        stage: { $ref: "#/components/schemas/LeadStage" }
        status: { $ref: "#/components/schemas/ContactStatus" }
        assignedSalespersonId: { type: string, nullable: true }
        assignedExpertId: { type: string, nullable: true }
        leadId: { type: string, nullable: true }
        wecomLinkId: { type: string, nullable: true }
        consentRecordId: { type: string, nullable: true }
        version: { type: integer, minimum: 1, description: Optimistic-concurrency token. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false

    ContactCreateRequest:
      type: object
      required: [displayName, preferredContactMethod]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        phoneE164: { type: string, pattern: "^\\+[1-9][0-9]{7,14}$" }
        wechatAlias: { type: string, maxLength: 64 }
        companyName: { type: string, maxLength: 200 }
        region: { type: string, enum: [HK, US, CN, OTHER], default: HK }
        locale: { type: string, enum: [zh-CN, en-US, zh-HK], default: zh-CN }
        preferredContactMethod: { $ref: "#/components/schemas/Channel" }
        source: { $ref: "#/components/schemas/LeadSource" }
        tags:
          type: array
          items: { type: string, maxLength: 40 }
        acceptTerms: { type: boolean, const: true, description: Legal acceptance is mandatory (internal terms version). }
      additionalProperties: false

    ContactPatchRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        phoneE164: { type: string, pattern: "^\\+[1-9][0-9]{7,14}$" }
        companyName: { type: string, maxLength: 200 }
        locale: { type: string, enum: [zh-CN, en-US, zh-HK] }
        preferredContactMethod: { $ref: "#/components/schemas/Channel" }
        tags:
          type: array
          items: { type: string, maxLength: 40 }
      additionalProperties: false

    AssignRequest:
      type: object
      required: [assigneeId, reason]
      properties:
        assigneeId: { type: string }
        reason: { type: string, minLength: 4, maxLength: 300 }
      additionalProperties: false

    StagePatchRequest:
      type: object
      required: [stage]
      properties:
        stage: { $ref: "#/components/schemas/LeadStage" }
        reason: { type: string, maxLength: 300 }
      additionalProperties: false

    Lead:
      type: object
      required: [id, source, status, createdAt, assignmentSlaMinutes]
      properties:
        id: { type: string }
        contactId: { type: string, nullable: true }
        source: { $ref: "#/components/schemas/LeadSource" }
        status: { $ref: "#/components/schemas/LeadStatus" }
        displayName: { type: string }
        note: { type: string, nullable: true }
        wecomUserId: { type: string, nullable: true }
        assigneeId: { type: string, nullable: true }
        assignedAt: { type: string, format: date-time, nullable: true }
        assignmentSlaMinutes:
          type: integer
          const: 300
          description: D-07 target is assignment within 5 minutes.
        contactedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    LeadCreateRequest:
      type: object
      required: [source, displayName]
      properties:
        source: { $ref: "#/components/schemas/LeadSource" }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        phoneE164: { type: string, pattern: "^\\+[1-9][0-9]{7,14}$" }
        wechatAlias: { type: string, maxLength: 64 }
        wecomUserId: { type: string, nullable: true }
        note: { type: string, maxLength: 1000 }
        assigneeId: { type: string, description: Optional explicit override; otherwise round-robin applies. }
      additionalProperties: false

    Conversation:
      type: object
      required: [id, channel, status, openedAt]
      properties:
        id: { type: string }
        contactId: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        status: { $ref: "#/components/schemas/ConversationStatus" }
        subject: { type: string, nullable: true }
        wecomExternalId: { type: string, nullable: true }
        lastMessageAt: { type: string, format: date-time, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        resolution: { type: string, nullable: true, enum: [HUMAN, DEFLECTED, TIMEOUT, null] }
        handledByStaff: { type: boolean, nullable: true }
        openedAt: { type: string, format: date-time }
      additionalProperties: false

    Message:
      type: object
      required: [id, conversationId, direction, channel, sentAt]
      properties:
        id: { type: string }
        conversationId: { type: string }
        direction: { type: string, enum: [INBOUND, OUTBOUND] }
        channel: { $ref: "#/components/schemas/Channel" }
        body: { type: string }
        wecomMessageId: { type: string, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        failedAt: { type: string, format: date-time, nullable: true }
        sentAt: { type: string, format: date-time }
      additionalProperties: false

    MessageCreateRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        replyToMessageId: { type: string }
      additionalProperties: false

    ResolveConversationRequest:
      type: object
      required: [resolution]
      properties:
        resolution: { type: string, enum: [HUMAN, DEFLECTED] }
        handledByStaff: { type: boolean }
        note: { type: string, maxLength: 1000 }
      allOf:
        - description: "Conditional: `resolution=DEFLECTED` requires `handledByStaff=false`."
      additionalProperties: false

    CSTicket:
      type: object
      required: [id, category, status, createdAt]
      properties:
        id: { type: string }
        contactId: { type: string }
        trademarkId: { type: string, nullable: true }
        category: { type: string, enum: [FILING, RENEWAL, OFFICE_ACTION, PAYMENT, OTHER] }
        status: { type: string, enum: [OPEN, IN_PROGRESS, WAITING_CLIENT, RESOLVED, CLOSED] }
        assigneeId: { type: string, nullable: true }
        resolutionNote: { type: string, nullable: true }
        firstResponseAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
      additionalProperties: false

    TicketCreateRequest:
      type: object
      required: [category, body]
      properties:
        category: { type: string, enum: [FILING, RENEWAL, OFFICE_ACTION, PAYMENT, OTHER] }
        body: { type: string, minLength: 1, maxLength: 4000 }
        trademarkId: { type: string }
      additionalProperties: false

    TimelineEvent:
      type: object
      required: [id, kind, at]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [STAGE_CHANGED, NOTE, ORDER_CREATED, ORDER_PAID, FILING_OPENED, FILING_RECORDED, MESSAGE, TICKET, DOCUMENT_UPLOADED]
        at: { type: string, format: date-time }
        actorId: { type: string, nullable: true }
        summary: { type: string }
        clientVisible: { type: boolean }
      additionalProperties: false

    TrademarkStatus:
      type: string
      enum: [DRAFT, ASSESSING, ASSESSED, WAITING_PAYMENT, FILED, ABANDONED, CLOSED]

    NiceClass:
      type: string
      pattern: "^[0-9]{3}$"
      description: Nice (international) class code, for example `045`.

    Trademark:
      type: object
      required: [id, name, markType, status, version, createdAt]
      properties:
        id: { type: string }
        contactId: { type: string }
        name: { type: string, maxLength: 255 }
        markType: { type: string, enum: [WORD, DESIGN, COMBINED] }
        status: { $ref: "#/components/schemas/TrademarkStatus" }
        description: { type: string, nullable: true }
        specimenDocumentId: { type: string, nullable: true }
        specimenApprovedAt: { type: string, format: date-time, nullable: true }
        designDocumentId: { type: string, nullable: true }
        powerOfAttorneyDocumentId: { type: string, nullable: true }
        niceClasses:
          type: array
          items: { $ref: "#/components/schemas/NiceClass" }
        jurisdiction: { type: string, enum: [US], default: US, description: P0 scope is US federal marks only. }
        externalId: { type: string, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false

    TrademarkCreateRequest:
      type: object
      required: [contactId, name, markType, niceClasses, consentForCorpusProcessing]
      properties:
        contactId: { type: string }
        name: { type: string, minLength: 1, maxLength: 255 }
        markType: { type: string, enum: [WORD, DESIGN, COMBINED] }
        description: { type: string, maxLength: 4000 }
        niceClasses:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/NiceClass" }
        specimenDocumentId: { type: string }
        designDocumentId: { type: string }
        locale: { type: string, enum: [zh-CN, en-US, zh-HK], default: zh-CN }
        consentForCorpusProcessing:
          type: boolean
          const: true
          description: Records PIPL corpus-processing consent; required before any LLM call.
      additionalProperties: false

    TrademarkPatchRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 4000 }
        niceClasses:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/NiceClass" }
        specimenDocumentId: { type: string }
        designDocumentId: { type: string }
      additionalProperties: false

    AssessmentConfidence:
      type: string
      enum: [LOW, MEDIUM, HIGH, INSUFFICIENT_DATA]

    PublicAssessment:
      type: object
      description: |
        Anonymous screening result (M8.1). No account, no `trademarkId`, no client identity and
        never `marginBps` or an internal score outside the disclosed set.
      required:
        - status
        - pRegistration
        - modelVersion
        - disclaimerVersion
        - isLegalAdvice
        - disclaimers
        - headlineConfidence
        - subSignals
        - riskFlags
        - recommendedNextActions
        - featureSnapshot
        - corpusFreshness
      properties:
        status: { type: string, enum: [scored, INSUFFICIENT_DATA] }
        pRegistration: { type: ["number", "null"], minimum: 0, maximum: 1 }
        method: { type: string, enum: [trigram, bge, hybrid] }
        modelVersion: { type: string, example: "bootstrap-0.1.0" }
        disclaimerVersion: { type: string, example: "disclaimer-1.0.0" }
        isLegalAdvice: { type: boolean, enum: [false] }
        disclaimer: { type: string }
        disclaimers:
          type: object
          required: [en, zh-CN, zh-TW]
          properties:
            en: { type: string }
            zh-CN: { type: string }
            zh-TW: { type: string }
          additionalProperties: false
        headlineConfidence: { $ref: "#/components/schemas/AssessmentConfidence" }
        subSignals:
          type: object
          required: [candidateCount, maxTrigram, maxPhonetic, minClassDistance, goodsMax]
          properties:
            candidateCount: { type: integer, minimum: 0 }
            maxTrigram: { type: number, minimum: 0, maximum: 1 }
            maxPhonetic: { type: number, minimum: 0, maximum: 1 }
            minClassDistance: { type: integer, minimum: 0 }
            goodsMax: { type: number, minimum: 0, maximum: 1 }
          additionalProperties: false
        riskFlags:
          type: array
          items: { type: string, enum: [DESCRIPTIVE, DISTINCTIVE, LIKELY_CONFLICT, INSUFFICIENT_SPECIMEN, INSUFFICIENT_CORPUS] }
        recommendedNextActions:
          type: array
          items: { type: string }
        featureSnapshot:
          type: object
          required: [query, modelVersion, topCandidates]
          properties:
            query:
              type: object
              required: [markText, classCodes, goodsSummary]
              properties:
                markText: { type: string }
                classCodes:
                  type: array
                  items: { type: integer, minimum: 1, maximum: 45 }
                goodsSummary: { type: ["string", "null"] }
              additionalProperties: false
            modelVersion: { type: string }
            topCandidates:
              type: array
              items:
                type: object
                required: [serialNumber, markText, score]
                properties:
                  serialNumber: { type: string }
                  markText: { type: string }
                  score: { type: number, minimum: 0, maximum: 1 }
                additionalProperties: false
          additionalProperties: false
        corpusFreshness:
          type: object
          required: [status, lastCompletedAt, ageHours, slaHours]
          properties:
            status: { type: string, enum: [fresh, stale, unknown] }
            lastCompletedAt: { type: ["string", "null"], format: date-time }
            ageHours: { type: ["number", "null"] }
            slaHours: { type: number }
          additionalProperties: false
      additionalProperties: false

    AssistantLocale:
      type: string
      description: |
        Answer and disclaimer locale; matches the D-03 disclaimer keys and the KB locales. This is
        not the request-header `Locale` parameter.
      enum: [en, zh-CN, zh-TW]
      default: zh-CN

    AssistantRequest:
      type: object
      description: |
        Minimised assistant inputs (M6.3). No person identifier (name, e-mail, phone, WeChat id) and
        no free-form question field: these structured fields are the only chat inputs.
      required: [markText]
      additionalProperties: false
      properties:
        markText: { type: string, minLength: 1, maxLength: 255 }
        classCodes:
          type: array
          description: Optional Nice class codes; entries outside 1..45 are ignored, not an error.
          items: { type: integer, minimum: 1, maximum: 45 }
        jurisdiction: { type: string, maxLength: 64 }
        businessDescription: { type: string, maxLength: 500 }
        locale: { $ref: "#/components/schemas/AssistantLocale" }

    AssistantResponse:
      type: object
      description: |
        RAG guidance envelope (M6.2 / M6.4). `answer` is `null` exactly when `status` is
        `degraded`, in which case `citations` hold the gateway-free retrieval results; the 3-locale
        disclaimer, both versions and `isLegalAdvice: false` are always present.
      required:
        - status
        - answer
        - citations
        - locale
        - isLegalAdvice
        - disclaimer
        - disclaimers
        - disclaimerVersion
        - modelVersion
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok, degraded] }
        answer: { type: ["string", "null"] }
        citations:
          type: array
          items:
            type: object
            required: [index, id, title, section, url, lang]
            additionalProperties: false
            properties:
              index: { type: integer, minimum: 1 }
              id: { type: string }
              title: { type: string }
              section: { type: string }
              url: { type: string }
              lang: { $ref: "#/components/schemas/AssistantLocale" }
        locale: { $ref: "#/components/schemas/AssistantLocale" }
        isLegalAdvice: { type: boolean, enum: [false] }
        disclaimer: { type: string }
        disclaimers:
          type: object
          required: [en, zh-CN, zh-TW]
          additionalProperties: false
          properties:
            en: { type: string }
            zh-CN: { type: string }
            zh-TW: { type: string }
        disclaimerVersion: { type: string, example: "disclaimer-1.0.0" }
        modelVersion: { type: string, example: "rag-1.0.0" }
        provider: { type: string }
        model: { type: string }

    Assessment:
      type: object
      description: |
        Append-only assessment record. `headlineScore` is `P(eventual registration)` and is never a
        legal opinion (D-03). `disclaimerVersion` is mandatory.
      required: [id, trademarkId, modelVersion, headlineScore, headlineConfidence, disclaimerVersion, createdAt]
      properties:
        id: { type: string }
        trademarkId: { type: string }
        runId: { type: string, nullable: true, description: Links the row to the model run record. }
        modelVersion: { type: string, example: "reg-prob-2026-02" }
        disclaimerVersion: { type: string, example: "disclaimer-2026-01" }
        headlineScore: { type: number, minimum: 0, maximum: 1, example: 0.62 }
        headlineConfidence: { $ref: "#/components/schemas/AssessmentConfidence" }
        similarMarkIds:
          type: array
          items: { type: string }
        classSimilarity:
          type: array
          items: { $ref: "#/components/schemas/ClassSimilarity" }
        distinctiveScore: { type: number, minimum: 0, maximum: 1 }
        specimenScore: { type: number, minimum: 0, maximum: 1 }
        goodsServicesScore: { type: number, minimum: 0, maximum: 1 }
        riskFlags:
          type: array
          items: { type: string, enum: [DESCRIPTIVE, DISTINCTIVE, LIKELY_CONFLICT, INSUFFICIENT_SPECIMEN, INSUFFICIENT_CORPUS] }
        recommendedNextActions:
          type: array
          items: { type: string }
        isLegalAdvice: { type: boolean, const: false }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    ClassSimilarity:
      type: object
      required: [niceClass, similarity]
      properties:
        niceClass: { $ref: "#/components/schemas/NiceClass" }
        similarity: { type: number, minimum: 0, maximum: 1 }
        driver: { type: string, enum: [LEXICAL, SEMANTIC, VISUAL, NONE] }
      additionalProperties: false

    AssessmentJobAccepted:
      type: object
      required: [assessmentId, status]
      properties:
        assessmentId: { type: string }
        status: { type: string, enum: [QUEUED] }
        estimatedSeconds: { type: integer, nullable: true }
      additionalProperties: false

    CorpusMatch:
      type: object
      required: [serialNumber, markText, score, method]
      properties:
        serialNumber: { type: string, example: "97842135" }
        registrationNumber: { type: string, nullable: true }
        markText: { type: string }
        niceClass: { $ref: "#/components/schemas/NiceClass" }
        statusCode: { type: string, enum: ["600", "700"] }
        status: { type: string, nullable: true, description: Human-readable USPTO status. }
        filedDate: { type: string, format: date, nullable: true }
        score: { type: number, minimum: 0, maximum: 1 }
        method: { type: string, enum: [trigram, bge, hybrid] }
        isLegalAdvice: { type: boolean, const: false }
      additionalProperties: false

    ApplicationStatus:
      type: string
      enum:
        - DRAFT
        - READY_TO_FILE
        - FILED
        - PUBLISHED
        - OFFICE_ACTION
        - REGISTERED
        - ABANDONED
        - REFUSED

    FilingMethod:
      type: string
      enum: [ATTENDED]
      description: |
        The only permitted value. Unattended or automated USPTO filing is prohibited (D-01,
        37 CFR 2.193).
      default: ATTENDED

    Application:
      type: object
      required: [id, trademarkId, contactId, status, filingMethod, version, createdAt]
      properties:
        id: { type: string }
        trademarkId: { type: string }
        contactId: { type: string }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        filingMethod: { $ref: "#/components/schemas/FilingMethod" }
        assignedExpertId: { type: string, nullable: true }
        attorney: { $ref: "#/components/schemas/FilingAttorney" }
        orderId: { type: string, nullable: true }
        usptoSerialNumber: { type: string, nullable: true }
        usptoRegistrationNumber: { type: string, nullable: true }
        filingDate: { type: string, format: date, nullable: true }
        lastTsdrSyncAt: { type: string, format: date-time, nullable: true }
        externalSource: { type: string, enum: [MANUAL, WEBCOM, BULK_IMPORT], nullable: true }
        externalReference: { type: string, nullable: true }
        deadlineAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false

    ApplicationListItem:
      type: object
      required: [id, contactId, status, filingMethod, version, createdAt]
      properties:
        id: { type: string }
        contactId: { type: string }
        serialNumber: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        filingMethod: { $ref: "#/components/schemas/FilingMethod" }
        filingDate: { type: string, format: date, nullable: true }
        deadlineAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false

    FilingAttorney:
      type: object
      required: [staffId, displayName, barNumber]
      properties:
        staffId: { type: string }
        displayName: { type: string }
        barNumber: { type: string, description: USPTO bar identifier required for the signature block. }
        firmName: { type: string, nullable: true }
      additionalProperties: false

    ApplicationCreateRequest:
      type: object
      required: [trademarkId, attorney, specimenDocumentId, powerOfAttorneyDocumentId]
      properties:
        trademarkId: { type: string }
        attorney: { $ref: "#/components/schemas/FilingAttorney" }
        specimenDocumentId: { type: string }
        powerOfAttorneyDocumentId: { type: string }
        orderId: { type: string, description: Paid order that funds this filing. }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    FilingSession:
      type: object
      required: [id, applicationId, status, checklist, openedAt]
      properties:
        id: { type: string }
        applicationId: { type: string }
        status: { type: string, enum: [OPEN, COMPLETED, ABANDONED] }
        openedByStaffId: { type: string }
        stepUpVerifiedAt: { type: string, format: date-time, description: Must be within 5 minutes. }
        checklist:
          type: array
          description: Attorney-facing ceremony steps, in order.
          items: { $ref: "#/components/schemas/FilingChecklistItem" }
        preFiledPacket:
          type: object
          description: Pre-filled data packet for manual TEAS entry; the API never submits it.
          additionalProperties: true
        openedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
      additionalProperties: false

    FilingChecklistItem:
      type: object
      required: [key, label, required]
      properties:
        key: { type: string, example: "specimen_approved" }
        label: { type: string, example: "Specimen version APPROVED" }
        required: { type: boolean }
        satisfied: { type: boolean }
        blocking: { type: boolean, description: True when the item blocks the receipt step. }
      additionalProperties: false

    FilingCompleteRequest:
      type: object
      required: [filingSessionId, usptoSerialNumber, filingDate, receiptDocumentId]
      properties:
        filingSessionId: { type: string }
        usptoSerialNumber: { type: string, pattern: "^[0-9]{8}$" }
        filingDate: { type: string, format: date }
        receiptDocumentId: { type: string, description: PDF or screenshot of the USPTO receipt. }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    OfficeAction:
      type: object
      required: [id, applicationId, receivedAt, responseDueAt, status]
      properties:
        id: { type: string }
        applicationId: { type: string }
        usptoDocumentCode: { type: string, nullable: true }
        title: { type: string }
        summary: { type: string, nullable: true }
        documentId: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
        responseDueAt: { type: string, format: date-time, description: Computed from the USPTO notice; never client-supplied. }
        respondedAt: { type: string, format: date-time, nullable: true }
        responseDocumentId: { type: string, nullable: true }
        status: { type: string, enum: [AWAITING_RESPONSE, DRAFTED, ATTORNEY_APPROVED, RESPONDED, OVERDUE] }
        llmDraftDocumentId: { type: string, nullable: true, description: Advisory draft; never auto-submitted. }
      additionalProperties: false

    OfficeActionResponseRequest:
      type: object
      required: [responseDocumentId, respondedAt]
      properties:
        responseDocumentId: { type: string }
        respondedAt: { type: string, format: date-time }
        llmDraftDocumentId: { type: string }
        attorneyNote: { type: string, maxLength: 2000 }
      additionalProperties: false

    IngestRun:
      type: object
      required: [id, startedAt, status]
      properties:
        id: { type: string }
        runDate: { type: string, format: date, nullable: true }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [RUNNING, SUCCEEDED, PARTIAL, FAILED] }
        marksImported: { type: integer, minimum: 0 }
        marksUpdated: { type: integer, minimum: 0 }
        marksRejected: { type: integer, minimum: 0 }
        durationSeconds: { type: integer, minimum: 0, nullable: true }
        errorCode: { type: string, nullable: true }
      additionalProperties: false

    DocumentCategory:
      type: string
      enum:
        - SPECIMEN
        - DESIGN
        - POWER_OF_ATTORNEY
        - OA_RESPONSE
        - USPTO_RECEIPT
        - INVOICE
        - IDENTITY
        - OTHER

    DocumentStatus:
      type: string
      enum: [PENDING_UPLOAD, READY, PROCESSING, FAILED, ARCHIVED]

    ProofreadStatus:
      type: string
      enum: [NOT_REQUESTED, PENDING, COMPLETED, FAILED]

    Document:
      type: object
      required: [id, category, status, currentVersion, createdAt]
      properties:
        id: { type: string }
        contactId: { type: string, nullable: true }
        trademarkId: { type: string, nullable: true }
        applicationId: { type: string, nullable: true }
        category: { $ref: "#/components/schemas/DocumentCategory" }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        currentVersion: { type: integer, minimum: 0 }
        approvedVersion: { type: integer, nullable: true, description: Version cleared by a human. }
        versions:
          type: array
          items: { $ref: "#/components/schemas/DocumentVersion" }
        proofreadStatus: { $ref: "#/components/schemas/ProofreadStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false

    DocumentVersion:
      type: object
      required: [version, status, uploadedAt]
      properties:
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [PENDING_UPLOAD, READY, FAILED, SUPERSEDED] }
        sizeBytes: { type: integer, minimum: 0 }
        mimeType: { type: string, example: application/pdf }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        objectKey: { type: string, description: Storage key; presigned access only, never public. }
        ocrStatus: { $ref: "#/components/schemas/ProofreadStatus" }
        proofreadStatus: { $ref: "#/components/schemas/ProofreadStatus" }
        proofreadFindingCount: { type: integer, minimum: 0, nullable: true }
        uploadedAt: { type: string, format: date-time, nullable: true }
      additionalProperties: false

    DocumentCreateRequest:
      type: object
      required: [category, filename, sizeBytes, mimeType, sha256]
      properties:
        category: { $ref: "#/components/schemas/DocumentCategory" }
        filename: { type: string, minLength: 1, maxLength: 255 }
        sizeBytes: { type: integer, minimum: 1, maximum: 26214400, description: 25 MB hard limit. }
        mimeType: { type: string, enum: [application/pdf, image/png, image/jpeg, image/webp, application/zip] }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: Verified server-side after upload. }
        contactId: { type: string }
        trademarkId: { type: string }
        applicationId: { type: string }
      additionalProperties: false

    DocumentUploadTicket:
      type: object
      required: [documentId, uploadUrl, expiresAt, method, headers]
      properties:
        documentId: { type: string }
        uploadUrl: { type: string, format: uri, description: Single-use presigned PUT. }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          description: Headers that must be replayed exactly, including `Content-Length` and `Content-Type`.
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
        maxSizeBytes: { type: integer, const: 26214400 }
      additionalProperties: false

    DocumentCompleteRequest:
      type: object
      required: [sha256]
      properties:
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
      additionalProperties: false

    ProofreadFinding:
      type: object
      required: [id, severity, excerpt, suggestion]
      properties:
        id: { type: string }
        severity: { type: string, enum: [INFO, LOW, MEDIUM, HIGH] }
        rule: { type: string, example: "TYPO_OCR" }
        page: { type: integer, minimum: 1, nullable: true }
        excerpt: { type: string }
        suggestion: { type: string, nullable: true }
        offsetStart: { type: integer, minimum: 0, nullable: true }
        offsetEnd: { type: integer, minimum: 0, nullable: true }
      additionalProperties: false

    ProofreadResult:
      type: object
      required: [documentId, version, status, findings]
      properties:
        documentId: { type: string }
        version: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/ProofreadStatus" }
        correctedText: { type: string, nullable: true }
        findings:
          type: array
          items: { $ref: "#/components/schemas/ProofreadFinding" }
        completedAt: { type: string, format: date-time, nullable: true }
      additionalProperties: false

    ProofreadUpdateRequest:
      type: object
      required: [baseVersion, decisions]
      properties:
        baseVersion: { type: integer, minimum: 1, description: If-Match equivalent for document versions. }
        decisions:
          type: array
          items:
            type: object
            required: [findingId, action]
            properties:
              findingId: { type: string }
              action: { type: string, enum: [ACCEPT, DISMISS, EDIT] }
              editedText: { type: string, description: Required when `action=EDIT`. }
            additionalProperties: false
      additionalProperties: false

    OrderStatus:
      type: string
      enum: [QUOTED, INVOICED, PAYMENT_PENDING, PAID, CANCELLED, REFUNDED, PARTIALLY_REFUNDED]

    PaymentStatus:
      type: string
      enum: [CREATED, PENDING, SUCCEEDED, FAILED, CANCELLED, REFUNDED]

    PaymentProvider:
      type: string
      enum: [STRIPE, PAYPAL, WECHAT_PAY, ALIPAY, MANUAL]

    ServiceCode:
      type: string
      enum:
        - ASSESSMENT_STANDARD
        - ASSESSMENT_PRIORITY
        - FILING_15CLASS
        - FILING_EXTRA_CLASS
        - OFFICE_ACTION_RESPONSE
        - RENEWAL_8YEAR
        - RENEWAL_10YEAR
        - OTHER

    Order:
      type: object
      required: [id, status, currency, subtotal, total, items, createdAt]
      properties:
        id: { type: string }
        orderNo: { type: string, description: Human-facing reference. }
        contactId: { type: string }
        trademarkId: { type: string, nullable: true }
        salesId: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/OrderStatus" }
        currency: { type: string, enum: [USD, CNY, HKD] }
        subtotal: { $ref: "#/components/schemas/Money" }
        discountTotal: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        displayTotal: { $ref: "#/components/schemas/DisplayMoney" }
        priceListVersion: { type: string, description: Server-side pricing authority snapshot. }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        invoiceId: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true, description: Quote expiry. }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false

    OrderItem:
      type: object
      required: [id, serviceCode, quantity, unitPrice, amount]
      properties:
        id: { type: string }
        serviceCode: { $ref: "#/components/schemas/ServiceCode" }
        description: { type: string, nullable: true }
        niceClass: { $ref: "#/components/schemas/NiceClass" }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: "#/components/schemas/Money" }
        amount: { $ref: "#/components/schemas/Money" }
        marginBps: { type: integer, description: Staff-only commercial margin in basis points; never exposed to clients. }
      additionalProperties: false

    OrderCreateRequest:
      type: object
      required: [contactId, items]
      properties:
        contactId: { type: string }
        trademarkId: { type: string }
        currency: { type: string, enum: [USD, CNY, HKD], default: USD }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [serviceCode, quantity]
            properties:
              serviceCode: { $ref: "#/components/schemas/ServiceCode" }
              quantity: { type: integer, minimum: 1, maximum: 20 }
              niceClass: { $ref: "#/components/schemas/NiceClass" }
            additionalProperties: false
        priceListVersion: { type: string, description: Optional expectation; a mismatch yields `409` for re-pricing. }
        displayCurrency: { type: string, enum: [CNY, HKD] }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    Payment:
      type: object
      required: [id, orderId, provider, status, amount, createdAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        provider: { $ref: "#/components/schemas/PaymentProvider" }
        providerPaymentId: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        amount: { $ref: "#/components/schemas/Money" }
        method: { type: string, nullable: true, description: Tokenised instrument label, never card data. }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    PaymentIntent:
      type: object
      required: [paymentId, provider, clientSecret, amount]
      properties:
        paymentId: { type: string }
        provider: { $ref: "#/components/schemas/PaymentProvider" }
        clientSecret: { type: string, description: Provider SDK secret; the browser confirms payment with the provider. }
        amount: { $ref: "#/components/schemas/Money" }
        expiresAt: { type: string, format: date-time }
        availableMethods:
          type: array
          description: Methods enabled by configuration and region, for example Stripe cards, Apple Pay, Google Pay.
          items: { type: string }
      additionalProperties: false

    InvoiceStatus:
      type: string
      enum: [DRAFT, ISSUED, PAID, VOID, REFUNDED]

    Invoice:
      type: object
      required: [id, orderId, status, total, issuedAt]
      properties:
        id: { type: string }
        invoiceNo: { type: string }
        orderId: { type: string }
        contactId: { type: string }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        total: { $ref: "#/components/schemas/Money" }
        displayTotal: { $ref: "#/components/schemas/DisplayMoney" }
        lines:
          type: array
          description: Immutable snapshot taken at issue time; later price changes never rewrite history.
          items: { $ref: "#/components/schemas/OrderItem" }
        documentId: { type: string, nullable: true, description: Generated PDF. }
        issuedAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
      additionalProperties: false

    RefundStatus:
      type: string
      enum: [PENDING, SUCCEEDED, FAILED, REVERSED]

    Refund:
      type: object
      required: [id, orderId, amount, status, createdAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        paymentId: { type: string, nullable: true }
        amount: { $ref: "#/components/schemas/Money" }
        reason: { type: string, maxLength: 500 }
        approvedByStaffId: { type: string, nullable: true, description: Required above the approval threshold. }
        status: { $ref: "#/components/schemas/RefundStatus" }
        providerRefundId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    RefundRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: { $ref: "#/components/schemas/Money" }
        reason: { type: string, minLength: 4, maxLength: 500 }
        approvedByStaffId: { type: string, description: Second approver for threshold refunds. }
      additionalProperties: false

    NotificationKind:
      type: string
      enum: [SECURITY, DEADLINE, PAYMENT, FILING, ASSIGNMENT, SYSTEM, MARKETING]

    Notification:
      type: object
      required: [id, kind, title, createdAt]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        title: { type: string }
        body: { type: string, nullable: true }
        link: { type: string, nullable: true }
        entityType: { type: string, nullable: true }
        entityId: { type: string, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    NotificationPreferences:
      type: object
      required: [channels, quietHours]
      properties:
        channels:
          type: object
          description: Per-kind enablement. `SECURITY` and `DEADLINE` are always `true` and immutable.
          additionalProperties: { type: boolean }
        quietHours:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            startLocal: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
            endLocal: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
            timezone: { type: string, default: Asia/Hong_Kong }
          additionalProperties: false
      additionalProperties: false

    PipelineStage:
      type: object
      required: [stage, count]
      properties:
        stage: { $ref: "#/components/schemas/LeadStage" }
        count: { type: integer, minimum: 0 }
        value: { $ref: "#/components/schemas/Money" }
        weightedValue: { $ref: "#/components/schemas/Money" }
        stalledCount: { type: integer, minimum: 0, description: Leads idle beyond the stage target. }
      additionalProperties: false

    PipelineSummary:
      type: object
      required: [stages, generatedAt]
      properties:
        stages:
          type: array
          items: { $ref: "#/components/schemas/PipelineStage" }
        totalOpenLeads: { type: integer, minimum: 0 }
        unassignedLeads: { type: integer, minimum: 0 }
        generatedAt: { type: string, format: date-time }
      additionalProperties: false

    FunnelMetricPoint:
      type: object
      required: [date, leads, contacts, assessments, filings, paidOrders]
      properties:
        date: { type: string, format: date }
        leads: { type: integer, minimum: 0 }
        contacts: { type: integer, minimum: 0 }
        assessments: { type: integer, minimum: 0 }
        filings: { type: integer, minimum: 0 }
        paidOrders: { type: integer, minimum: 0 }
      additionalProperties: false

    FunnelMetrics:
      type: object
      required: [series, rates, generatedAt]
      properties:
        series:
          type: array
          items: { $ref: "#/components/schemas/FunnelMetricPoint" }
        rates:
          type: object
          required:
            - leadToContactRate
            - contactToAssessmentRate
            - contactToFilingRate
            - orderPaidRate
            - botDeflectionRate
            - meanFirstReplyMinutes
            - p95AssignmentMinutes
          properties:
            leadToContactRate: { type: number, minimum: 0, maximum: 1 }
            contactToAssessmentRate: { type: number, minimum: 0, maximum: 1 }
            contactToFilingRate: { type: number, minimum: 0, maximum: 1 }
            orderPaidRate: { type: number, minimum: 0, maximum: 1 }
            botDeflectionRate: { type: number, minimum: 0, maximum: 1 }
            meanFirstReplyMinutes: { type: number, minimum: 0 }
            p95AssignmentMinutes:
              type: number
              minimum: 0
              description: D-07 target is at or below 5.
          additionalProperties: false
        generatedAt: { type: string, format: date-time }
      additionalProperties: false

    BudgetRow:
      type: object
      required: [id, channel, periodStart, periodEnd, budget, spent]
      properties:
        id: { type: string }
        channel: { type: string, enum: [WECHAT, REDBOOK, GOOGLE, META, TIKTOK, PARTNER, OTHER] }
        campaign: { type: string, nullable: true }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        budget: { $ref: "#/components/schemas/Money" }
        spent: { $ref: "#/components/schemas/Money" }
        leadsAttributed: { type: integer, minimum: 0, nullable: true }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false

    BudgetRowCreateRequest:
      type: object
      required: [channel, periodStart, periodEnd, budget, spent]
      properties:
        channel: { type: string, enum: [WECHAT, REDBOOK, GOOGLE, META, TIKTOK, PARTNER, OTHER] }
        campaign: { type: string, maxLength: 200 }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        budget: { $ref: "#/components/schemas/Money" }
        spent: { $ref: "#/components/schemas/Money" }
        leadsAttributed: { type: integer, minimum: 0 }
      additionalProperties: false

    AuditEntry:
      type: object
      required: [id, action, actorId, entityType, entityId, at]
      properties:
        id: { type: string }
        action: { type: string, example: VAULT_SECRET_REVEALED }
        actorId: { type: string }
        actorRole: { $ref: "#/components/schemas/Role" }
        entityType: { type: string, example: StaffUser }
        entityId: { type: string }
        metadata:
          type: object
          description: Redacted context; PII values and secrets are never stored (01-system-design section 11).
          additionalProperties: true
        ipHash: { type: string, nullable: true, description: Salted hash, never a raw IP. }
        at: { type: string, format: date-time }
      additionalProperties: false

    QueueName:
      type: string
      enum:
        - assessment
        - document-ocr
        - proofread
        - invoice-pdf
        - notification
        - wecom-sync
        - tm-ingest
        - tm-search-index
        - reconciliation
        - maintenance

    JobState:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, DEAD_LETTERED, REPLAYED]

    Job:
      type: object
      required: [id, queue, name, state, attempts, createdAt]
      properties:
        id: { type: string }
        queue: { $ref: "#/components/schemas/QueueName" }
        name: { type: string }
        state: { $ref: "#/components/schemas/JobState" }
        attempts: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, nullable: true }
        lastErrorCode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false

    JobAccepted:
      type: object
      required: [jobId, status]
      properties:
        jobId: { type: string }
        status: { type: string, enum: [QUEUED] }
        queue: { $ref: "#/components/schemas/QueueName" }
      additionalProperties: false

    AnalyticsEvent:
      type: object
      required: [name, at]
      properties:
        name:
          type: string
          description: Closed taxonomy; unknown names are rejected with `400`.
          enum:
            - page_view
            - assessment_requested
            - assessment_viewed
            - checkout_started
            - payment_succeeded
            - filing_recorded
            - conversation_opened
            - conversation_deflected
        at: { type: string, format: date-time }
        entityType: { type: string, nullable: true }
        entityId: { type: string, nullable: true }
        properties:
          type: object
          additionalProperties: { type: ["string", "number", "boolean", "null"] }
      additionalProperties: false

    AnalyticsBatch:
      type: object
      required: [events]
      properties:
        sessionId: { type: string, nullable: true }
        events:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/AnalyticsEvent" }
      additionalProperties: false
