openapi: 3.1.0

info:
  title: Mark-US API
  version: "1.0.0"
  summary: REST contract for the US trademark application platform (P0-P8).
  description: |
    # Mark-US API v1

    Normative contract for `apps/api` (Hono). Companion documents:
    `docs/architecture/01-system-design.md` (cross-cutting rules),
    `docs/architecture/02-data-model.md` (schema),
    `docs/architecture/04-implementation-mandates.md` (mandates).

    ## Cross-cutting rules (binding)

    1. **Base path** `/api/v1` for all business operations. Breaking changes require `/api/v2`;
       additive fields never bump the version. The three operational endpoints (`/health`,
       `/health/ready`, `/metrics`) are the deliberate exception: they are unversioned at the server
       root so that load balancers, Docker health checks and CI probes do not have to track API
       versions, and each declares its own `servers` entry.
    2. **Errors** are always `application/problem+json` (RFC 9457) with a stable `code` and a `traceId`
       that support can quote. Handlers must not return ad-hoc error shapes.
    3. **AuthN**: staff = `mkus_staff` session cookie; client = `mkus_portal` session cookie obtained by
       redeeming a single-use magic link. All mutations additionally require header `x-csrf-token`
       bound to the session. Webhooks are exempt from CSRF and require provider signatures instead.
    4. **AuthZ** is enforced at three layers (01-system-design section 5.3). Each operation declares
       the minimum permission in `x-permission` and the row scope in `x-scope`.
    5. **Money** is a decimal **string** plus ISO-4217 currency, never a JSON number. `DisplayMoney`
       carries the CNY presentation rate resolved server-side (D-05) and is informational only.
    6. **Instants** are RFC 3339 UTC. Calendar dates are `YYYY-MM-DD` strings.
    7. **Pagination** is cursor-based: `?cursor=&limit=` (default 25, max 100) returning
       `{ items, nextCursor }`. `offset` is forbidden.
    8. **Idempotency**: operations marked `x-idempotent` require header `Idempotency-Key`; a replay
       within 24 h returns the original response with header `Idempotent-Replay: true`.
    9. **Concurrency**: mutable aggregates expose `version`; conflicting writes send `If-Match`,
       otherwise the API returns `409` with the current representation under `extensions.current`.
    10. **Locale**: `?locale=zh-CN|en-US|zh-HK` (default `zh-CN`).
    11. **Disclosure**: probability-bearing responses always carry `modelVersion` and `disclaimerVersion`.
    12. **PII**: request and response bodies are never logged. Redaction rules: 01-system-design section 11.

    ## Contract maturity

    Every operation carries `x-contract-status`:

    | Value | Meaning |
    | --- | --- |
    | `final` | Frozen. Handlers and tests are validated against this file. |
    | `provisional` | Shape agreed; a field may still be renamed before the owning phase starts. |
    | `PENDING-Pn` | Deferred: the owning phase must publish a contract revision before implementation. |

    ## Coverage by phase

    | Phase | Surface | Status |
    | --- | --- | --- |
    | P0 | `/health`, `/health/ready`, `/metrics` | final |
    | P1 | auth, staff admin, vault, contacts, leads, conversations, notifications | final / provisional |
    | P2 | trademarks, assessments, documents, uploads, proofreading | final |
    | P3 | WeCom intake, archive sync, tickets, pipeline, funnel metrics | final / provisional |
    | P4 | orders, payments, invoices, refunds, reconciliation | final / `PENDING-P4` (provider payloads) |
    | P5 | corpus search, TSDR sync, ingest runs, OA ingest, filing ceremony | provisional / `PENDING-P5` (ranking) |
    | P6 | probability model payloads, calibration report, copy generation | `PENDING-P6` (frozen after gate M5a) |
    | P7 | ERP, dashboards, audit log, job administration | provisional / `PENDING-P7` |
    | P8 | data export and erasure (PIPL), analytics beacon | `PENDING-P8` |

servers:
  - url: https://api.markus.hk/api/v1
    description: Production (Hong Kong) — business operations
  - url: https://staging.api.markus.hk/api/v1
    description: Staging — business operations
  - url: http://localhost:3001/api/v1
    description: Local development — business operations

security:
  - staffSession: []
    csrfToken: []

tags:
  - name: health
    description: Liveness, readiness and metrics
  - name: auth
    description: Staff sessions, MFA, client magic links
  - name: staff
    description: Staff provisioning and the USPTO credential vault
  - name: crm
    description: Contacts, leads, conversations, tickets
  - name: trademarks
    description: Marks, assessments, corpus search
  - name: assistant
    description: Anonymous RAG guidance assistant
  - name: filings
    description: Applications, office actions, filing ceremony, ingest
  - name: documents
    description: Versioned documents, OCR and proofreading
  - name: commerce
    description: Orders, payments, invoices, refunds
  - name: notifications
    description: Notification inbox and preferences
  - name: erp
    description: Pipeline, funnel metrics, marketing budget
  - name: audit
    description: Audit trail and job administration
  - name: integrations
    description: WeCom callback verification

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      description: |
        Unversioned by design, so that load balancers, the Docker health check and the CI smoke
        test do not track API versions. The shipped P0 payload is contractual: the CI gate asserts
        `ok === true`, so the field name may not change without changing the gate in the same commit.
      security: []
      servers:
        - url: https://api.markus.hk
        - url: https://staging.api.markus.hk
        - url: http://localhost:3001
      x-contract-status: final
      x-phase: P0
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Readiness probe (Postgres, Redis, object storage)
      security: []
      servers:
        - url: https://api.markus.hk
        - url: https://staging.api.markus.hk
        - url: http://localhost:3001
      x-contract-status: final
      x-phase: P0
      responses:
        "200":
          description: All dependencies ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }
        "503":
          description: A dependency is unavailable
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /metrics:
    get:
      operationId: getMetrics
      tags: [health]
      summary: Prometheus exposition (internal network only)
      security: []
      servers:
        - url: https://api.markus.hk
        - url: https://staging.api.markus.hk
        - url: http://localhost:3001
      x-contract-status: final
      x-phase: P0
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema: { type: string }

  /auth/staff/login:
    post:
      operationId: loginStaff
      tags: [auth]
      summary: Staff login; returns an MFA challenge when TOTP is enabled
      security: []
      x-contract-status: final
      x-phase: P1
      x-ratelimit: "10 / 15min per IP+email; 5 failures lock the account for 15 min"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "202":
          description: Password accepted, MFA challenge issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaChallengeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "423":
          description: Account locked after repeated failures
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/staff/mfa/verify:
    post:
      operationId: verifyStaffMfa
      tags: [auth]
      summary: Complete MFA and establish the session
      security: []
      x-contract-status: final
      x-phase: P1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaVerifyRequest" }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Challenge expired or already consumed
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/staff/logout:
    post:
      operationId: logoutStaff
      tags: [auth]
      summary: Destroy the current staff session
      x-contract-status: final
      x-phase: P1
      x-permission: self
      x-scope: own-session
      responses:
        "204": { description: Session destroyed (idempotent) }

  /auth/magic-link:
    post:
      operationId: requestMagicLink
      tags: [auth]
      summary: Client passwordless sign-in request (public)
      description: |
        Always answers `202` with a neutral body; never reveals whether the contact exists
        (anti-enumeration, Mandate 8).
      security: []
      x-contract-status: final
      x-phase: P1
      x-ratelimit: "5 / 1h per contact; 20 / 1h per IP"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagicLinkRequest" }
      responses:
        "202":
          description: Link dispatched, or silently ignored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagicLinkAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/magic-link/verify:
    post:
      operationId: redeemMagicLink
      tags: [auth]
      summary: Redeem a single-use magic-link token; sets the portal session cookie
      security: []
      x-contract-status: final
      x-phase: P1
      x-ratelimit: "10 / 15min per token; 5 wrong attempts destroy the token"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagicLinkVerifyRequest" }
      responses:
        "200":
          description: Portal session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalSessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Token invalid, expired or already used
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/me:
    get:
      operationId: getCurrentActor
      tags: [auth]
      summary: Identity, role, locale and effective capabilities
      x-contract-status: final
      x-phase: P1
      x-permission: self
      x-scope: own-session
      responses:
        "200":
          description: Current actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorContext" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff accounts
      x-contract-status: provisional
      x-phase: P1
      x-permission: staff.manage
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/StaffStatus" }
      responses:
        "200":
          description: Staff page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StaffUser" }
                  nextCursor: { type: ["string", "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: provisionStaff
      tags: [staff]
      summary: Provision a staff account (no self-registration, D-06)
      x-contract-status: final
      x-phase: P1
      x-permission: staff.manage
      x-audit: STAFF_PROVISIONED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffCreateRequest" }
      responses:
        "201":
          description: Created; a one-time activation link is delivered out-of-band
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Email already provisioned
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /staff/{staffId}:
    parameters:
      - $ref: "#/components/parameters/StaffId"
    get:
      operationId: getStaff
      tags: [staff]
      summary: Staff detail
      x-contract-status: provisional
      x-phase: P1
      x-permission: staff.manage
      responses:
        "200":
          description: Staff detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateStaff
      tags: [staff]
      summary: Update role, status, locale or profile
      description: Role or status changes terminate active sessions in the same transaction.
      x-contract-status: final
      x-phase: P1
      x-permission: staff.manage
      x-audit: STAFF_UPDATED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffPatchRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /staff/{staffId}/disable:
    parameters:
      - $ref: "#/components/parameters/StaffId"
    post:
      operationId: disableStaff
      tags: [staff]
      summary: Disable an account, revoking sessions and vault access
      x-contract-status: final
      x-phase: P1
      x-permission: staff.manage
      x-audit: STAFF_DISABLED
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisableStaffRequest" }
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Refused because open applications have imminent deadlines
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /staff/{staffId}/vault:
    parameters:
      - $ref: "#/components/parameters/StaffId"
    put:
      operationId: writeVaultSecret
      tags: [staff]
      summary: Store (rotate) the attorney USPTO credentials
      description: |
        Envelope-encrypts with a per-attorney DEK wrapped by the KMS KEK. The MFA seed is never
        accepted: it is not in the schema and any request containing it fails with
        `400 UNKNOWN_FIELD` (D-01).
      x-contract-status: final
      x-phase: P1
      x-permission: vault.uspto.write
      x-audit: VAULT_SECRET_WRITTEN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VaultWriteRequest" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "428":
          description: MFA step-up required before vault writes
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      operationId: deleteVaultSecret
      tags: [staff]
      summary: Remove stored USPTO credentials
      x-contract-status: final
      x-phase: P1
      x-permission: vault.uspto.write
      x-audit: VAULT_SECRET_DELETED
      responses:
        "204": { description: Secret removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /staff/{staffId}/vault/reveal:
    parameters:
      - $ref: "#/components/parameters/StaffId"
    post:
      operationId: revealVaultSecret
      tags: [staff]
      summary: Decrypt and return a USPTO credential (audited, step-up gated)
      description: |
        Requires step-up authentication within the last 5 minutes. Writes
        `AuditLog(action=VAULT_SECRET_REVEALED)` in the same transaction, including denied attempts.
        Response is `Cache-Control: no-store`. Rate limit 10 per hour per actor.
      x-contract-status: final
      x-phase: P1
      x-permission: vault.uspto.read
      x-audit: VAULT_SECRET_REVEALED
      x-ratelimit: "10 / 1h per actor"
      responses:
        "200":
          description: Decrypted credential
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultRevealResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "428":
          description: MFA step-up required
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /contacts:
    get:
      operationId: listContacts
      tags: [crm]
      summary: List contacts visible to the actor
      description: |
        `x-scope`: a `SALESPERSON` receives only rows where
        `assignedSalespersonId = actor.id`, enforced in SQL rather than by post-filtering.
        `EXPERT` and `MASTER_ADMIN` may pass `scope=all` (expert is read-only).
      x-contract-status: final
      x-phase: P1
      x-permission: contact.read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Locale"
        - name: stage
          in: query
          schema: { $ref: "#/components/schemas/LeadStage" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ContactStatus" }
        - name: q
          in: query
          description: Match on name or wechatAlias (trigram-indexed)
          schema: { type: string, maxLength: 100 }
        - name: scope
          in: query
          schema: { type: string, enum: [mine, all] }
      responses:
        "200":
          description: Contact page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Contact" }
                  nextCursor: { type: ["string", "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createContact
      tags: [crm]
      summary: Create a contact from a sales-originated lead
      x-contract-status: final
      x-phase: P1
      x-permission: contact.create
      x-audit: CONTACT_CREATED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactCreateRequest" }
      responses:
        "201":
          description: Created and assigned per the round-robin policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Duplicate email, phone or wechatAlias
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /contacts/{contactId}:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    get:
      operationId: getContact
      tags: [crm]
      summary: Contact detail with owner, consent and stage
      x-contract-status: final
      x-phase: P1
      x-permission: contact.read
      x-scope: owner-or-all
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Absent, or not visible to this actor (existence is not leaked)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      operationId: updateContact
      tags: [crm]
      summary: Update contact profile, tags or stage
      x-contract-status: final
      x-phase: P1
      x-permission: contact.write
      x-scope: owner-or-all
      x-audit: CONTACT_UPDATED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactPatchRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Optimistic-concurrency failure (If-Match mismatch)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      operationId: archiveContact
      tags: [crm]
      summary: Soft-delete a contact (starts the PIPL erasure workflow)
      description: Orders, invoices and filings are retained; the erasure job scrubs PII columns.
      x-contract-status: provisional
      x-phase: P8
      x-permission: contact.delete
      x-audit: CONTACT_ARCHIVED
      responses:
        "204": { description: Archived }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Retained records require a Master Admin override with a recorded reason
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /contacts/{contactId}/assign:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    post:
      operationId: assignContactOwner
      tags: [crm]
      summary: Override the round-robin owner (Master Admin)
      x-contract-status: final
      x-phase: P1
      x-permission: lead.assign
      x-audit: CONTACT_REASSIGNED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignRequest" }
      responses:
        "200":
          description: Reassigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts/{contactId}/timeline:
    parameters:
      - $ref: "#/components/parameters/ContactId"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
    get:
      operationId: getContactTimeline
      tags: [crm]
      summary: Unified client-visible history (stage moves, orders, filings, messages)
      description: |
        Client actors (role: null) read only their own timeline: the contactId path must equal
        the session's contactId, any other contactId returns 404 and confirms nothing. Staff
        actors are not served on this self-service surface (403).
      x-contract-status: provisional
      x-phase: P2
      x-permission: self
      x-scope: own-contact
      responses:
        "200":
          description: Timeline page, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TimelineEvent" }
                  nextCursor: { type: ["string", "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts/{contactId}/tickets:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    get:
      operationId: listContactTickets
      tags: [crm]
      summary: List service tickets for a contact
      x-contract-status: final
      x-phase: P3
      x-permission: ticket.read
      x-scope: owner-or-all
      responses:
        "200":
          description: Ticket list
          content:
