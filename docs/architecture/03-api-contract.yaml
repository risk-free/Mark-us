      x-contract-status: final
      x-phase: P5
      x-permission: case.file
      x-audit: FILING_SESSION_STARTED
      responses:
        "201":
          description: Session opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilingSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A session is already open, or a precondition is unmet
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "428":
          description: MFA step-up required
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /applications/{applicationId}/filing-session/complete:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: completeFilingSession
      tags: [filings]
      summary: Record the USPTO filing receipt (serial number, filing date, receipt artefact)
      x-contract-status: final
      x-phase: P5
      x-permission: case.file
      x-idempotent: true
      x-audit: FILING_RECEIPT_RECORDED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FilingCompleteRequest" }
      responses:
        "200":
          description: Receipt recorded; the application becomes FILED
          headers:
            Idempotent-Replay: { $ref: "#/components/headers/IdempotentReplay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
