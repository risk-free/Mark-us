      summary: List marks
      x-contract-status: final
      x-phase: P2
      x-permission: trademark.read
      x-scope: owner-unless-scope-all
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Locale"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TrademarkStatus" }
        - name: contactId
          in: query
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string, enum: [mine, all] }
      responses:
        "200":
          description: Trademark page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Trademark" }
                  nextCursor: { type: ["string", "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createTrademark
      tags: [trademarks]
      summary: Create a mark and queue the first assessment
      description: |
        `consentForCorpusProcessing=true` records `ConsentRecord(PIPL_PRIVACY, policyVersion)` and is
        a precondition for sending mark text to the LLM gateway (02-data-model section 1.1).
      x-contract-status: final
      x-phase: P2
      x-permission: trademark.write
      x-scope: owner-or-all
      x-idempotent: true
      x-audit: TRADEMARK_CREATED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrademarkCreateRequest" }
      responses:
        "201":
          description: Created; assessment queued
          headers:
            Idempotent-Replay: { $ref: "#/components/headers/IdempotentReplay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trademark" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Duplicate mark for the same contact (case-insensitive title plus class)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /trademarks/{trademarkId}:
    parameters:
      - $ref: "#/components/parameters/TrademarkId"
    get:
      operationId: getTrademark
      tags: [trademarks]
      summary: Mark detail with the latest assessment reference
      x-contract-status: final
      x-phase: P2
      x-permission: trademark.read
      x-scope: owner-or-all
      responses:
        "200":
          description: Mark
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trademark" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateTrademark
      tags: [trademarks]
      summary: Update mark details before filing
      description: Forbidden once the mark leaves `ASSESSING` or `DRAFT`; filed data is immutable.
      x-contract-status: final
      x-phase: P2
      x-permission: trademark.write
      x-scope: owner-or-all
      x-audit: TRADEMARK_UPDATED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrademarkPatchRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trademark" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Illegal state for modification, or If-Match mismatch
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /trademarks/{trademarkId}/assessments:
    parameters:
      - $ref: "#/components/parameters/TrademarkId"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
    get:
      operationId: listAssessments
      tags: [trademarks]
      summary: Assessment history (append-only)
      x-contract-status: PENDING-P6
      x-phase: P6
      x-permission: trademark.read
      x-scope: owner-or-all
      responses:
        "200":
          description: Assessment page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Assessment" }
                  nextCursor: { type: ["string", "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: requestAssessment
      tags: [trademarks]
      summary: Queue a fresh assessment
      description: |
        Limited to 3 queued-or-running assessments per mark per hour. Each run appends a new
        `TrademarkAssessment`; prior rows are never modified.
      x-contract-status: PENDING-P6
      x-phase: P6
      x-permission: trademark.assess
      x-scope: owner-or-all
      x-idempotent: true
      x-ratelimit: "3 / 1h per mark"
      x-audit: ASSESSMENT_REQUESTED
      responses:
        "202":
          description: Queued
          headers:
            Idempotent-Replay: { $ref: "#/components/headers/IdempotentReplay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentJobAccepted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /tm/search:
    get:
      operationId: searchTrademarks
      tags: [trademarks]
      summary: Search the local USPTO corpus for similar marks (P5)
      description: |
        Candidates are narrowed by Nice class, then ranked by trigram similarity (BGE embeddings when
        A3 is enabled; the method is reported). Results are a similarity signal, never a legal opinion
        and never a registration probability.
      x-contract-status: PENDING-P5
      x-phase: P5
      x-permission: tm.search
      x-ratelimit: "60 / 1min per actor"
      parameters:
        - name: q
          in: query
          required: true
          description: Mark text to compare
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: niceClass
          in: query
          schema: { type: string, pattern: "^[0-9]{3}$" }
        - name: statusCode
          in: query
          description: 600 pending, 700 registered
          schema: { type: string, enum: ["600", "700"] }
        - name: minScore
          in: query
          schema: { type: number, minimum: 0, maximum: 1 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Ranked candidates
          content:
            application/json:
              schema:
                type: object
                required: [items, method, corpusIngestedAt]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CorpusMatch" }
                  method: { type: string, enum: [trigram, bge, hybrid] }
                  corpusIngestedAt: { type: string, format: date-time }
                  stale:
                    type: boolean
                    description: True when the corpus is older than 26 hours
                  nextCursor: { type: ["string", "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Corpus search exceeded the 2 s statement timeout
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /tm/assess:
    get:
      operationId: assessTrademark
      tags: [trademarks]
      summary: Anonymous trademark screening assessment (P5)
      description: |
        Stateless screening result for an unauthenticated visitor, cached for 24 h keyed by the
        normalised mark text, class and goods. The response always carries the 3-locale disclaimer,
        the model and disclaimer versions, `isLegalAdvice: false`, and never any client identity,
        `marginBps` or an internal score outside the disclosed set (M8.1).
      security: []
      servers:
        - url: https://api.markus.hk
        - url: https://staging.api.markus.hk
        - url: http://localhost:3001
      x-contract-status: PENDING-P5
      x-phase: P5
      x-ratelimit: "20 / 1h per IP; 5 / 1h per (normalised mark, class)"
      parameters:
        - name: q
          in: query
          required: true
          description: Mark text to assess
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: niceClass
          in: query
          schema: { type: string, pattern: "^[0-9]{3}$" }
        - name: goods
          in: query
          schema: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Anonymous screening result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicAssessment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Corpus assessment exceeded the timeout
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /tm/assistant:
    post:
      operationId: assistantChat
      tags: [assistant]
      summary: Anonymous trademark guidance assistant (RAG)
      description: |
        Stateless, unauthenticated RAG guidance. The only inputs are mark text, Nice class(es),
        jurisdiction and an optional business description — no person identifiers and no
        free-form question field ever cross the LLM boundary (M6.3); the gateway's PII guard is the
        second line of defence. Every response carries the 3-locale disclaimer, the disclaimer and
        RAG prompt/model versions, and `isLegalAdvice: false` (M6.2). When the model is unavailable
        the endpoint still returns `200` with `status: "degraded"`, the retrieval `citations` and
        `answer: null` — never a fabricated answer and never a 5xx (M6.4).
      security: []
      servers:
        - url: https://api.markus.hk
        - url: https://staging.api.markus.hk
        - url: http://localhost:3001
      x-contract-status: PENDING-P6
      x-phase: P6
      x-ratelimit: "30 / 1h per IP"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantRequest" }
      responses:
        "200":
          description: Guidance answer, or cited references when the model is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /applications:
    get:
      operationId: listApplications
      tags: [filings]
      summary: List the client's own applications (self-service surface)
      description: |
        Client actors (role: null) see only applications linked to their contact through an
        order, newest first, cursor-paginated. Staff actors are not served on this surface
        (403) — the staff attorney queue is not implemented in this phase.
      x-contract-status: provisional
      x-phase: P2
      x-permission: self
      x-scope: own-contact
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Application page, client-safe projection
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ApplicationListItem" }
                  nextCursor: { type: ["string", "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createApplication
      tags: [filings]
      summary: Open a filing package for a paid mark
      description: |
        Preconditions, all enforced with `409` on failure: order `PAID`; specimen document version
        `APPROVED`; power of attorney version `APPROVED`; actor holds `case.file` (an attorney act,
        37 CFR 2.193). `filingMethod` is always `ATTENDED` (D-01).
      x-contract-status: final
      x-phase: P5
      x-permission: case.file
      x-idempotent: true
      x-audit: FILING_OPENED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationCreateRequest" }
      responses:
        "201":
          description: Filing package opened
          headers:
            Idempotent-Replay: { $ref: "#/components/headers/IdempotentReplay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Precondition unmet (unpaid order, missing or unapproved document, wrong role)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      operationId: getApplication
      tags: [filings]
      summary: Application detail with office actions and deadline
      description: |
        Client actors (role: null) receive only applications linked to their contact through an
        order; any other applicationId returns 404 and confirms nothing. Staff actors are not
        served on this self-service surface (403). The projection excludes internal notes and
        assessment internals.
      x-contract-status: provisional
      x-phase: P2
      x-permission: self
      x-scope: own-contact
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /applications/{applicationId}/filing-session:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: startFilingSession
      tags: [filings]
      summary: Begin the attended filing ceremony (attorney only, step-up auth)
      description: |
        Returns a checklist plus the pre-filed data packet. The system never automates the TEAS
        submission: the attorney executes it and then records the receipt. At most one active session
